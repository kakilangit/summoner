[package]
name = "summoner-cli"
version = "0.1.9"
edition = "2024"
description = "CLI for the Summoner AI agent orchestration platform"
license = "MIT"
repository = "https://github.com/kakilangit/hocuspocus"

[[bin]]
name = "summoner"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
colored = "3"
indicatif = "0.17"
directories = "6"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
expect_used = "deny"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
