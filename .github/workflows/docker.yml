name: Docker

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Images to build"
        required: true
        type: choice
        options:
          - app
          - builder
          - base
          - seed
          - all
        default: app
      tag:
        description: "Image tag (cannot be 'latest')"
        required: true
        type: string

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    steps:
      - name: Reject 'latest' tag
        if: ${{ inputs.tag == 'latest' }}
        run: |
          echo "::error::Tag 'latest' is not allowed for manual dispatch. Use a version tag instead."
          exit 1

  build:
    needs: validate
    uses: ./.github/workflows/docker-build.yml
    with:
      images: ${{ inputs.images }}
      tag: ${{ inputs.tag }}
      latest: false
    permissions:
      contents: read
      packages: write
