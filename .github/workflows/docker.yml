name: Docker

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Images to build"
        required: true
        type: choice
        options:
          - app
          - builder
          - base
          - seed
          - all
        default: app
      tag:
        description: "Image tag"
        required: false
        type: string
        default: latest

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: ghcr.io/kakilangit/summoner
  BUILDER_IMAGE: ghcr.io/kakilangit/summoner-builder
  BASE_IMAGE: ghcr.io/kakilangit/summoner-base
  SEED_IMAGE: ghcr.io/kakilangit/summoner-seed

jobs:
  builder:
    name: Builder Image
    if: ${{ inputs.images == 'builder' || inputs.images == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/builder/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BUILDER_IMAGE }}:${{ inputs.tag }}
          cache-from: |
            type=registry,ref=${{ env.BUILDER_IMAGE }}:${{ inputs.tag }}
          cache-to: type=inline

  base:
    name: Base Image
    if: ${{ inputs.images == 'base' || inputs.images == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:${{ inputs.tag }}
          cache-from: |
            type=registry,ref=${{ env.BASE_IMAGE }}:${{ inputs.tag }}
          cache-to: type=inline

  app:
    name: App Image
    needs: [builder, base]
    # Run even if builder/base were skipped (already exist on registry)
    if: ${{ always() && (inputs.images == 'app' || inputs.images == 'all') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ inputs.tag }}
          build-args: |
            BUILDER_IMAGE=${{ env.BUILDER_IMAGE }}:${{ inputs.tag }}
            BASE_IMAGE=${{ env.BASE_IMAGE }}:${{ inputs.tag }}
          cache-from: |
            type=registry,ref=${{ env.DOCKER_IMAGE }}:${{ inputs.tag }}
          cache-to: type=inline

  seed:
    name: Seed Image
    if: ${{ always() && (inputs.images == 'seed' || inputs.images == 'all') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/seed/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.SEED_IMAGE }}:${{ inputs.tag }}
          cache-from: |
            type=registry,ref=${{ env.SEED_IMAGE }}:${{ inputs.tag }}
          cache-to: type=inline
