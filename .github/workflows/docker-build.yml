name: Docker Build

on:
  workflow_call:
    inputs:
      images:
        description: "Images to build (app, builder, base, seed, all)"
        required: true
        type: string
      tag:
        description: "Image tag"
        required: true
        type: string
      latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: ghcr.io/kakilangit/summoner
  BUILDER_IMAGE: ghcr.io/kakilangit/summoner-builder
  BASE_IMAGE: ghcr.io/kakilangit/summoner-base
  SEED_IMAGE: ghcr.io/kakilangit/summoner-seed

jobs:
  # ---------- Builder ----------
  builder-build:
    name: Builder (${{ matrix.platform }})
    if: ${{ inputs.images == 'builder' || inputs.images == 'all' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/builder/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.BUILDER_IMAGE }}:${{ inputs.tag }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Summoner builder image (Elixir + Rust)
            org.opencontainers.image.licenses=MIT
          cache-from: type=registry,ref=${{ env.BUILDER_IMAGE }}:${{ inputs.tag }}-${{ matrix.suffix }}
          cache-to: type=inline

  builder-manifest:
    name: Builder Manifest
    needs: builder-build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ env.BUILDER_IMAGE }}:${{ inputs.tag }} \
            ${{ env.BUILDER_IMAGE }}:${{ inputs.tag }}-amd64 \
            ${{ env.BUILDER_IMAGE }}:${{ inputs.tag }}-arm64

          if [ "${{ inputs.latest }}" = "true" ]; then
            docker buildx imagetools create -t ${{ env.BUILDER_IMAGE }}:latest \
              ${{ env.BUILDER_IMAGE }}:${{ inputs.tag }}-amd64 \
              ${{ env.BUILDER_IMAGE }}:${{ inputs.tag }}-arm64
          fi

  # ---------- Base ----------
  base-build:
    name: Base (${{ matrix.platform }})
    if: ${{ inputs.images == 'base' || inputs.images == 'all' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.BASE_IMAGE }}:${{ inputs.tag }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Summoner runtime base image
            org.opencontainers.image.licenses=MIT
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:${{ inputs.tag }}-${{ matrix.suffix }}
          cache-to: type=inline

  base-manifest:
    name: Base Manifest
    needs: base-build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ env.BASE_IMAGE }}:${{ inputs.tag }} \
            ${{ env.BASE_IMAGE }}:${{ inputs.tag }}-amd64 \
            ${{ env.BASE_IMAGE }}:${{ inputs.tag }}-arm64

          if [ "${{ inputs.latest }}" = "true" ]; then
            docker buildx imagetools create -t ${{ env.BASE_IMAGE }}:latest \
              ${{ env.BASE_IMAGE }}:${{ inputs.tag }}-amd64 \
              ${{ env.BASE_IMAGE }}:${{ inputs.tag }}-arm64
          fi

  # ---------- App ----------
  app-build:
    name: App (${{ matrix.platform }})
    needs: [builder-manifest, base-manifest]
    if: ${{ always() && (inputs.images == 'app' || inputs.images == 'all') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ inputs.tag }}-${{ matrix.suffix }}
          build-args: |
            BUILDER_IMAGE=${{ env.BUILDER_IMAGE }}:${{ inputs.tag }}-${{ matrix.suffix }}
            BASE_IMAGE=${{ env.BASE_IMAGE }}:${{ inputs.tag }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Summoner - Local-first AI agent platform
            org.opencontainers.image.licenses=MIT
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:${{ inputs.tag }}-${{ matrix.suffix }}
          cache-to: type=inline

  app-manifest:
    name: App Manifest
    needs: app-build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_IMAGE }}:${{ inputs.tag }} \
            ${{ env.DOCKER_IMAGE }}:${{ inputs.tag }}-amd64 \
            ${{ env.DOCKER_IMAGE }}:${{ inputs.tag }}-arm64

          if [ "${{ inputs.latest }}" = "true" ]; then
            docker buildx imagetools create -t ${{ env.DOCKER_IMAGE }}:latest \
              ${{ env.DOCKER_IMAGE }}:${{ inputs.tag }}-amd64 \
              ${{ env.DOCKER_IMAGE }}:${{ inputs.tag }}-arm64
          fi

  # ---------- Seed ----------
  seed-build:
    name: Seed (${{ matrix.platform }})
    if: ${{ always() && (inputs.images == 'seed' || inputs.images == 'all') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/seed/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.SEED_IMAGE }}:${{ inputs.tag }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Summoner database seed image
            org.opencontainers.image.licenses=MIT
          cache-from: type=registry,ref=${{ env.SEED_IMAGE }}:${{ inputs.tag }}-${{ matrix.suffix }}
          cache-to: type=inline

  seed-manifest:
    name: Seed Manifest
    needs: seed-build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ env.SEED_IMAGE }}:${{ inputs.tag }} \
            ${{ env.SEED_IMAGE }}:${{ inputs.tag }}-amd64 \
            ${{ env.SEED_IMAGE }}:${{ inputs.tag }}-arm64

          if [ "${{ inputs.latest }}" = "true" ]; then
            docker buildx imagetools create -t ${{ env.SEED_IMAGE }}:latest \
              ${{ env.SEED_IMAGE }}:${{ inputs.tag }}-amd64 \
              ${{ env.SEED_IMAGE }}:${{ inputs.tag }}-arm64
          fi
